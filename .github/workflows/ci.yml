name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/server.sh
          bash -n scripts/client.sh
          bash -n scripts/client_services.sh
          bash -n scripts/unified_control.sh
          python3 -m py_compile scripts/control_center.py

      - name: Bootstrap freshness and phase contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTO_AGENT_BOOTSTRAP_VERSION="0.5.2"' install.sh
          grep -q 'Cache-Control: no-cache' install.sh
          grep -q 'auto_agent_cache_bust=' install.sh
          grep -q 'CLIENT PHASE 1/3' install.sh
          grep -q 'CLIENT PHASE 2/3' install.sh
          grep -q 'CLIENT PHASE 3/3' install.sh
          grep -q 'scripts/client_services.sh' install.sh
          grep -q 'scripts/unified_control.sh' install.sh

      - name: Bootstrap stdin isolation contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'run_bash_component' install.sh
          grep -q '</dev/tty' install.sh
          grep -q '</dev/null' install.sh
          grep -q 'stream-isolated' install.sh
          grep -Fq 'run_bash_component "$TMP"' install.sh
          grep -Fq 'run_bash_component "$SVC_TMP" LAN_CONTROL=0' install.sh
          grep -Fq 'run_bash_component "$UNIFIED_TMP"' install.sh
          ! grep -q '^ *exec bash ' install.sh

      - name: Inventory-first and reuse contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SERVER PRE-FLIGHT INVENTORY (NO CHANGES YET)' scripts/server.sh
          grep -q 'CLIENT PRE-FLIGHT INVENTORY (NO CHANGES YET)' scripts/client.sh
          grep -q 'install ONLY missing packages/components' scripts/server.sh
          grep -q 'Model already installed; download skipped' scripts/server.sh
          grep -q 'Hermes exists; installer skipped' scripts/client.sh
          grep -q 'OpenClaw exists; installer skipped' scripts/client.sh

      - name: GPU and model inspection contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'nvidia-smi --query-gpu=index,name,driver_version,memory.total,pci.bus_id' scripts/server.sh
          grep -q 'ollama list' scripts/server.sh
          grep -q '/api/show' scripts/server.sh
          grep -q 'capabilities' scripts/server.sh
          grep -q 'MIN_AGENT_CONTEXT' scripts/server.sh
          grep -q 'UPDATE_OLLAMA' scripts/server.sh

      - name: Client runtime reuse contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'prepare_client_runtime_path' install.sh
          grep -q '\$HOME/.local/bin' install.sh
          grep -q '\$HOME/.hermes/node/bin' install.sh
          grep -q 'Node runtime: .*\[REUSE\]' install.sh
          grep -q 'OpenClaw exists but no Node runtime was found' install.sh

      - name: Secure deployment and discovery contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTO_AGENT_COMPONENT=server' scripts/server.sh
          grep -q 'AUTO_AGENT_COMPONENT=client' scripts/client.sh
          grep -q 'AUTO_AGENT_COMPONENT=client-services' scripts/client_services.sh
          grep -q 'AUTO_AGENT_COMPONENT=unified-control' scripts/unified_control.sh
          grep -q 'OLLAMA_HOST=127.0.0.1:11434' scripts/server.sh
          grep -q '_local-ai._tcp' scripts/server.sh
          grep -q '/auto-agent/discovery' scripts/client.sh
          grep -q 'scan_new' scripts/client.sh
          grep -q 'scan_legacy' scripts/client.sh
          grep -q 'SSH_TARGET="${SSH_USER}@${SERVER_IP}"' scripts/client.sh

      - name: Agent integration contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'hermes-agent.nousresearch.com/install.sh' scripts/client.sh
          grep -q 'openclaw.ai/install.sh' scripts/client.sh
          grep -q 'models.providers.ollama.baseUrl' scripts/client.sh
          grep -q 'config set tools.profile messaging' scripts/client.sh
          grep -q 'chatCompletions.*enabled' scripts/unified_control.sh
          grep -q '"-z"' scripts/control_center.py
          grep -q 'openclaw/default' scripts/control_center.py
          grep -q 'X-Forwarded-For' scripts/control_center.py

      - name: OpenClaw readiness semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'openclaw_startup_probe' scripts/client.sh
          grep -q '/startupz' scripts/client.sh
          grep -q 'status.*started' scripts/client.sh
          grep -q 'openclaw_startup_probe' scripts/client_services.sh
          grep -q '/startupz' scripts/client_services.sh
          grep -q 'status.*started' scripts/client_services.sh
          ! grep -q 'reachable=bool(rpc.get' scripts/client.sh
          ! grep -q 'reachable.*rpc.get' scripts/client_services.sh

      - name: End-to-end readiness contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'verify_remote_inference' scripts/client.sh
          grep -q '/chat/completions' scripts/client.sh
          grep -q 'Hermes configuration verified' scripts/client.sh
          grep -q 'OpenClaw Gateway service running; HTTP /startupz=started' scripts/client.sh
          grep -Fq 'run_bash_component "$SVC_TMP" LAN_CONTROL=0' install.sh

      - name: Boot persistence and unified control contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'loginctl enable-linger' scripts/client_services.sh
          grep -q 'gateway install --start-now --start-on-login' scripts/client_services.sh
          grep -q 'auto-agent-hermes-dashboard.service' scripts/client_services.sh
          grep -q 'OpenClaw gateway enabled + running + /startupz=started' scripts/client_services.sh
          grep -q 'config patch --stdin' scripts/unified_control.sh
          grep -q '"mode": "trusted-proxy"' scripts/unified_control.sh
          grep -q 'identityScopes' scripts/unified_control.sh
          grep -q 'requiredHeaders' scripts/unified_control.sh
          grep -q '"allowLoopback": True' scripts/unified_control.sh
          grep -q 'listen ${CENTER_PORT}' scripts/unified_control.sh
          grep -q 'allow ${LAN_CIDR}' scripts/unified_control.sh
          grep -q 'auth_request /_auth' scripts/unified_control.sh
          grep -q 'proxy_set_header X-Forwarded-User' scripts/unified_control.sh
          grep -q "sub_filter '<body>'" scripts/unified_control.sh
          grep -q '@hermes' scripts/control_center.py
          grep -q '@openclaw' scripts/control_center.py
          grep -q 'location.href=hermesUrl' scripts/control_center.py
          grep -q 'LOGIN_MAX_ATTEMPTS' scripts/control_center.py
          grep -q 'AUTO_AGENT UNIFIED CONTROL CENTER READY' scripts/unified_control.sh

      - name: Ensure no hard-coded API token
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'API_TOKEN=[A-Fa-f0-9]{64}' . --exclude-dir=.git
