name: Async Chat CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  async-chat-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ui_upgrade.sh
          python3 -m py_compile scripts/control_center_v2.py scripts/control_center_v4.py scripts/control_center_v5.py
          node --check scripts/control_center_async.js
          node --check scripts/control_center_polish.js

      - name: Async + runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ThreadPoolExecutor(' scripts/control_center_v4.py
          grep -Fq '"/api/chat/jobs/"' scripts/control_center_v4.py
          grep -Fq 'resolve_runtime_policy' scripts/control_center_v4.py
          grep -Fq 'agent.run_budget_seconds' scripts/control_center_v4.py
          grep -Fq 'agents.defaults.timeoutSeconds' scripts/control_center_v4.py
          grep -Fq 'poll_token' scripts/control_center_v4.py
          grep -Fq 'for (;;)' scripts/control_center_async.js
          grep -Fq 'X-Auto-Agent-Job-Token' scripts/control_center_async.js
          ! grep -Fq '15 minute client wait limit' scripts/control_center_async.js
          ! grep -Fq 'timeout=900' scripts/control_center_v4.py

      - name: History + presentation contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'chat_history.sqlite3' scripts/control_center_v5.py
          grep -Fq '/api/history' scripts/control_center_v5.py
          grep -Fq 'history_append' scripts/control_center_v5.py
          grep -Fq 'verbatim pass-through' scripts/control_center_v5.py
          grep -Fq 'AutoAgentRenderMessage' scripts/control_center_polish.js
          grep -Fq -- '--chat-font:17px' scripts/control_center_polish.js
          grep -Fq 'History' scripts/control_center_polish.js
          grep -Fq 'window.AutoAgentChat' scripts/control_center_async.js
          grep -Fq 'autoagent:history-changed' scripts/control_center_async.js
          grep -Fq 'control_center_v5.py' scripts/ui_upgrade.sh
          grep -Fq 'control_center_polish.js' scripts/ui_upgrade.sh
          grep -Fq 'Hermes/OpenClaw output remains verbatim' scripts/ui_upgrade.sh

      - name: Runtime policy unit test
        shell: bash
        env:
          AUTO_AGENT_APP_DIR: ${{ github.workspace }}/scripts
          AUTO_AGENT_CONTROL_PASSWORD: test-password
          AUTO_AGENT_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OPENCLAW_LOCAL_PASSWORD: local-password
          AUTO_AGENT_PUBLIC_DOMAIN: example.com
          AUTO_AGENT_CENTER_PUBLIC_HOST: workspace.example.com
          AUTO_AGENT_HERMES_PUBLIC_HOST: hermes.example.com
          AUTO_AGENT_OPENCLAW_PUBLIC_HOST: openclaw.example.com
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('cc4', 'scripts/control_center_v4.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert m.parse_duration('null', 123) is None
          assert m.parse_duration('0', 123) is None
          assert m.parse_duration('172800', None) == 172800
          assert m.transport_timeout({'hard_limit_seconds': None}) is None
          assert m.transport_timeout({'hard_limit_seconds': 600}) > 600
          PY

      - name: Persistent history unit test
        shell: bash
        env:
          AUTO_AGENT_APP_DIR: ${{ github.workspace }}/scripts
          AUTO_AGENT_HISTORY_DB: ${{ runner.temp }}/auto_agent_history.sqlite3
          AUTO_AGENT_CONTROL_PASSWORD: test-password
          AUTO_AGENT_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OPENCLAW_LOCAL_PASSWORD: local-password
          AUTO_AGENT_PUBLIC_DOMAIN: example.com
          AUTO_AGENT_CENTER_PUBLIC_HOST: workspace.example.com
          AUTO_AGENT_HERMES_PUBLIC_HOST: hermes.example.com
          AUTO_AGENT_OPENCLAW_PUBLIC_HOST: openclaw.example.com
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location('cc5', 'scripts/control_center_v5.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          m.init_db()
          conv='unit-history-1'
          m.history_append(conv,'user','', 'network diagnostics')
          m.history_append(conv,'assistant','hermes','**Result:**\n- raw agent output')
          item=m.history_get(conv)
          assert item['conversation']['title']=='network diagnostics'
          assert [x['role'] for x in item['messages']]==['user','assistant']
          assert item['messages'][1]['content']=='**Result:**\n- raw agent output'
          assert m.history_list(10)[0]['id']==conv
          assert m.history_delete(conv)
          assert m.history_get(conv) is None
          PY
