name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/server.sh
          bash -n scripts/client.sh
          bash -n scripts/client_services.sh
          bash -n scripts/unified_control_v2.sh
          bash -n scripts/openclaw_sso_v2.sh
          bash -n scripts/ui_upgrade.sh
          python3 -m py_compile scripts/control_center.py scripts/control_center_v2.py scripts/control_center_v3.py scripts/control_center_v4.py scripts/control_center_v5.py
          node --check scripts/control_center_async.js
          node --check scripts/control_center_polish.js

      - name: Bootstrap v0.6.2 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTO_AGENT_BOOTSTRAP_VERSION="0.6.2"' install.sh
          grep -q 'Cache-Control: no-cache' install.sh
          grep -q 'auto_agent_cache_bust=' install.sh
          grep -q 'run_bash_component' install.sh
          grep -Fq 'scripts/unified_control_v2.sh' install.sh
          grep -Fq 'scripts/ui_upgrade.sh' install.sh
          grep -Fq 'scripts/openclaw_sso_v2.sh' install.sh
          grep -Fq 'AUTO_AGENT_COMPONENT=ui-v062' scripts/ui_upgrade.sh
          grep -Fq "download_component scripts/ui_upgrade.sh \"\$UI_TMP\" 'AUTO_AGENT_COMPONENT=ui-v062'" install.sh

      - name: Inventory-first and reuse contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SERVER PRE-FLIGHT INVENTORY (NO CHANGES YET)' scripts/server.sh
          grep -q 'CLIENT PRE-FLIGHT INVENTORY (NO CHANGES YET)' scripts/client.sh
          grep -q 'install ONLY missing packages/components' scripts/server.sh
          grep -q 'Model already installed; download skipped' scripts/server.sh
          grep -q 'Hermes exists; installer skipped' scripts/client.sh
          grep -q 'OpenClaw exists; installer skipped' scripts/client.sh
          grep -q 'nvidia-smi --query-gpu=index,name,driver_version,memory.total,pci.bus_id' scripts/server.sh
          grep -q 'ollama list' scripts/server.sh
          grep -q '/api/show' scripts/server.sh

      - name: Runtime and readiness contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'prepare_client_runtime_path' install.sh
          grep -q '\$HOME/.hermes/node/bin' install.sh
          grep -q 'openclaw_startup_probe' scripts/client.sh
          grep -q '/startupz' scripts/client.sh
          grep -q 'verify_remote_inference' scripts/client.sh
          grep -q '/chat/completions' scripts/client.sh

      - name: Resilient native SSO contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTO_AGENT_SSO_TTL.*, "180"' scripts/control_center_v2.py
          grep -q 'SSO_BRIDGE_COOKIE = "__Secure-auto_agent_sso_bridge"' scripts/control_center_v2.py
          grep -q 'def make_sso_token' scripts/control_center_v2.py
          grep -q 'def consume_sso_token' scripts/control_center_v2.py
          grep -q 'USED_SSO_NONCES' scripts/control_center_v2.py
          grep -q 'def bridge_cookie' scripts/control_center_v2.py
          grep -q '"HttpOnly"' scripts/control_center_v2.py
          grep -q '"Secure"' scripts/control_center_v2.py
          grep -q '"SameSite=Lax"' scripts/control_center_v2.py
          ! grep -q 'cf_access_authed' scripts/control_center_v2.py
          ! grep -q 'Cf-Access-Jwt-Assertion' scripts/control_center_v2.py

      - name: UI + persistent history contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'AUTO_AGENT_COMPONENT=ui-v062' scripts/ui_upgrade.sh
          grep -Fq 'control_center_v5.py' scripts/ui_upgrade.sh
          grep -Fq 'control_center_polish.js' scripts/ui_upgrade.sh
          grep -Fq 'Persistent server-side SQLite chat history installed' scripts/ui_upgrade.sh
          grep -Fq 'Hermes/OpenClaw output remains verbatim' scripts/ui_upgrade.sh
          grep -Fq 'class="sidebar"' scripts/control_center_ui.html
          grep -Fq 'id="sidebarToggle"' scripts/control_center_ui.html
          grep -Fq 'sidebar-collapsed' scripts/control_center_ui.html
          grep -Fq 'class="composer-wrap"' scripts/control_center_ui.html
          grep -Fq '<textarea id="prompt"' scripts/control_center_ui.html
          ! grep -Fq 'class="topbar"' scripts/control_center_ui.html
          grep -Fq 'chat_history.sqlite3' scripts/control_center_v5.py
          grep -Fq '/api/history' scripts/control_center_v5.py
          grep -Fq 'verbatim pass-through' scripts/control_center_v5.py
          grep -Fq -- '--chat-font:17px' scripts/control_center_polish.js
          grep -Fq 'AutoAgentRenderMessage' scripts/control_center_polish.js

      - name: Agent-owned runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'agent.run_budget_seconds' scripts/control_center_v4.py
          grep -Fq 'agent.gateway_timeout' scripts/control_center_v4.py
          grep -Fq 'agents.defaults.timeoutSeconds' scripts/control_center_v4.py
          grep -Fq 'def resolve_runtime_policy' scripts/control_center_v4.py
          grep -Fq 'X-Auto-Agent-Job-Token' scripts/control_center_v4.py
          grep -Fq 'for (;;)' scripts/control_center_async.js
          ! grep -Fq '15 minute client wait limit' scripts/control_center_async.js
          ! grep -Fq 'timeout=900' scripts/control_center_v4.py

      - name: Nginx public boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PUBLIC_DOMAIN="${AUTO_AGENT_PUBLIC_DOMAIN:-kumakenchi.jp}"' scripts/unified_control_v2.sh
          grep -Fq 'CENTER_PUBLIC_HOST="${AUTO_AGENT_CENTER_PUBLIC_HOST:-workspace.${PUBLIC_DOMAIN}}"' scripts/unified_control_v2.sh
          grep -Fq 'HERMES_PUBLIC_HOST="${AUTO_AGENT_HERMES_PUBLIC_HOST:-hermes.${PUBLIC_DOMAIN}}"' scripts/unified_control_v2.sh
          grep -Fq 'OPENCLAW_PUBLIC_HOST="${AUTO_AGENT_OPENCLAW_PUBLIC_HOST:-openclaw.${PUBLIC_DOMAIN}}"' scripts/unified_control_v2.sh
          grep -Fq '$http_cf_connecting_ip' scripts/unified_control_v2.sh
          grep -Fq 'X-Auto-Agent-SSO-Boundary 1' scripts/unified_control_v2.sh
          ! grep -Fq 'proxy_set_header Cf-Access-Jwt-Assertion' scripts/unified_control_v2.sh

      - name: OpenClaw finalization contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"mode": "trusted-proxy"' scripts/openclaw_sso_v2.sh
          grep -q '"deviceAutoApprove"' scripts/openclaw_sso_v2.sh
          grep -q '"operator.admin" not in scopes' scripts/openclaw_sso_v2.sh
          grep -q 'trusted-proxy HTTP smoke PASS' scripts/openclaw_sso_v2.sh
          grep -q 'Restarting OpenClaw Gateway once after final atomic configuration' scripts/openclaw_sso_v2.sh

      - name: Ensure no hard-coded API token
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'API_TOKEN=[A-Fa-f0-9]{64}' . --exclude-dir=.git
