name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/server.sh
          bash -n scripts/client.sh
          bash -n scripts/client_services.sh
          bash -n scripts/unified_control.sh
          bash -n scripts/openclaw_sso.sh
          bash -n scripts/unified_control_v2.sh
          bash -n scripts/openclaw_sso_v2.sh
          python3 -m py_compile scripts/control_center.py scripts/control_center_v2.py

      - name: Bootstrap v0.5.8 contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'AUTO_AGENT_BOOTSTRAP_VERSION="0.5.8"' install.sh
          grep -q 'Cache-Control: no-cache' install.sh
          grep -q 'auto_agent_cache_bust=' install.sh
          grep -q 'run_bash_component' install.sh
          grep -q '</dev/tty' install.sh
          grep -q '</dev/null' install.sh
          grep -Fq 'scripts/unified_control_v2.sh' install.sh
          grep -Fq 'scripts/openclaw_sso_v2.sh' install.sh
          ! grep -Fq 'download_component scripts/unified_control.sh "$UNIFIED_TMP"' install.sh
          ! grep -Fq 'download_component scripts/openclaw_sso.sh "$SSO_TMP"' install.sh

      - name: Inventory-first and reuse contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SERVER PRE-FLIGHT INVENTORY (NO CHANGES YET)' scripts/server.sh
          grep -q 'CLIENT PRE-FLIGHT INVENTORY (NO CHANGES YET)' scripts/client.sh
          grep -q 'install ONLY missing packages/components' scripts/server.sh
          grep -q 'Model already installed; download skipped' scripts/server.sh
          grep -q 'Hermes exists; installer skipped' scripts/client.sh
          grep -q 'OpenClaw exists; installer skipped' scripts/client.sh
          grep -q 'nvidia-smi --query-gpu=index,name,driver_version,memory.total,pci.bus_id' scripts/server.sh
          grep -q 'ollama list' scripts/server.sh
          grep -q '/api/show' scripts/server.sh

      - name: Runtime and readiness contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'prepare_client_runtime_path' install.sh
          grep -q '\$HOME/.hermes/node/bin' install.sh
          grep -q 'openclaw_startup_probe' scripts/client.sh
          grep -q '/startupz' scripts/client.sh
          grep -q 'openclaw_startup_probe' scripts/client_services.sh
          grep -q '/startupz' scripts/client_services.sh
          grep -q 'verify_remote_inference' scripts/client.sh
          grep -q '/chat/completions' scripts/client.sh
          ! grep -q 'reachable=bool(rpc.get' scripts/client.sh

      - name: Signed one-time SSO contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'def make_sso_token' scripts/control_center_v2.py
          grep -q 'def consume_sso_token' scripts/control_center_v2.py
          grep -q 'USED_SSO_NONCES' scripts/control_center_v2.py
          grep -q 'SSO_LOCK' scripts/control_center_v2.py
          grep -q '"/sso/hermes"' scripts/control_center_v2.py
          grep -q '"/sso/openclaw"' scripts/control_center_v2.py
          grep -q '"/_auto_agent_sso"' scripts/control_center_v2.py
          grep -q 'invalid_or_replayed_sso_token' scripts/control_center_v2.py
          grep -q 'AUTO_AGENT_NATIVE_SESSION_TTL' scripts/control_center_v2.py
          grep -q 'AUTO_AGENT_SSO_TTL' scripts/control_center_v2.py
          grep -q 'parts.append("Secure")' scripts/control_center_v2.py
          ! grep -q 'cf_access_authed' scripts/control_center_v2.py
          ! grep -q 'Cf-Access-Jwt-Assertion' scripts/control_center_v2.py
          ! grep -q 'Domain=.kumakenchi.jp' scripts/control_center_v2.py

      - name: SSO replay test
        shell: bash
        env:
          AUTO_AGENT_CONTROL_PASSWORD: test-password
          AUTO_AGENT_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OPENCLAW_LOCAL_PASSWORD: local-password
          AUTO_AGENT_CENTER_PUBLIC_HOST: workspace.example.com
          AUTO_AGENT_HERMES_PUBLIC_HOST: hermes.example.com
          AUTO_AGENT_OPENCLAW_PUBLIC_HOST: openclaw.example.com
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("cc", "scripts/control_center_v2.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          session = m.make_session(30)
          assert m.validate_session(session)
          token = m.make_sso_token("hermes")
          assert m.consume_sso_token(token, "hermes", "hermes.example.com")
          assert not m.consume_sso_token(token, "hermes", "hermes.example.com"), "SSO replay was accepted"
          wrong = m.make_sso_token("openclaw")
          assert not m.consume_sso_token(wrong, "hermes", "hermes.example.com")
          assert "/sso/hermes" in m.app_page()
          assert "/sso/openclaw" in m.app_page()
          PY

      - name: Nginx public boundary contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PUBLIC_DOMAIN="${AUTO_AGENT_PUBLIC_DOMAIN:-kumakenchi.jp}"' scripts/unified_control_v2.sh
          grep -Fq 'CENTER_PUBLIC_HOST="${AUTO_AGENT_CENTER_PUBLIC_HOST:-workspace.${PUBLIC_DOMAIN}}"' scripts/unified_control_v2.sh
          grep -Fq 'HERMES_PUBLIC_HOST="${AUTO_AGENT_HERMES_PUBLIC_HOST:-hermes.${PUBLIC_DOMAIN}}"' scripts/unified_control_v2.sh
          grep -Fq 'OPENCLAW_PUBLIC_HOST="${AUTO_AGENT_OPENCLAW_PUBLIC_HOST:-openclaw.${PUBLIC_DOMAIN}}"' scripts/unified_control_v2.sh
          grep -Fq '$http_cf_connecting_ip' scripts/unified_control_v2.sh
          grep -Fq 'proxy_set_header X-Forwarded-For $auto_agent_client_ip;' scripts/unified_control_v2.sh
          grep -Fq 'proxy_set_header X-Real-IP $auto_agent_client_ip;' scripts/unified_control_v2.sh
          grep -Fq 'X-Auto-Agent-SSO-Boundary 1' scripts/unified_control_v2.sh
          grep -Fq 'X-Auto-Agent-SSO-Target hermes' scripts/unified_control_v2.sh
          grep -Fq 'X-Auto-Agent-SSO-Target openclaw' scripts/unified_control_v2.sh
          grep -Fq 'login?next=/sso/hermes' scripts/unified_control_v2.sh
          grep -Fq 'login?next=/sso/openclaw' scripts/unified_control_v2.sh
          grep -Fq 'Public DNS unresolved:' scripts/unified_control_v2.sh
          ! grep -Fq 'proxy_set_header Cf-Access-Jwt-Assertion' scripts/unified_control_v2.sh

      - name: Unified Chat timeout contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'CENTER_API_TIMEOUT="${CONTROL_CENTER_API_TIMEOUT:-930}"' scripts/unified_control_v2.sh
          grep -Fq 'location ^~ /api/' scripts/unified_control_v2.sh
          grep -Fq 'proxy_send_timeout ${CENTER_API_TIMEOUT}s;' scripts/unified_control_v2.sh
          grep -Fq 'proxy_read_timeout ${CENTER_API_TIMEOUT}s;' scripts/unified_control_v2.sh
          grep -Fq 'proxy_buffering off;' scripts/unified_control_v2.sh
          grep -q 'async function jsonResponse' scripts/control_center_v2.py
          grep -q 'expected JSON, received' scripts/control_center_v2.py

      - name: OpenClaw finalization and attribution contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"mode": "trusted-proxy"' scripts/openclaw_sso_v2.sh
          grep -q '"deviceAutoApprove"' scripts/openclaw_sso_v2.sh
          grep -q '"operator.admin" not in scopes' scripts/openclaw_sso_v2.sh
          grep -q '"publicOrigin"' scripts/openclaw_sso_v2.sh
          grep -q 'https://{public_host}' scripts/openclaw_sso_v2.sh
          grep -q '198.51.100.10' scripts/openclaw_sso_v2.sh
          grep -q 'trusted-proxy HTTP smoke PASS' scripts/openclaw_sso_v2.sh
          grep -Fq 'proxy_set_header X-Forwarded-For $auto_agent_client_ip;' scripts/openclaw_sso_v2.sh
          ! grep -Fq 'proxy_set_header Cf-Access-Jwt-Assertion' scripts/openclaw_sso_v2.sh
          ! grep -q 'gateway restart' scripts/unified_control_v2.sh
          ! grep -q 'config patch --stdin' scripts/unified_control_v2.sh

      - name: OpenClaw restart ownership
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Restarting OpenClaw Gateway once after final atomic configuration' scripts/openclaw_sso_v2.sh
          grep -q 'Gateway restart   : exactly once in finalization phase' scripts/openclaw_sso_v2.sh

      - name: Ensure no hard-coded API token
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE 'API_TOKEN=[A-Fa-f0-9]{64}' . --exclude-dir=.git
