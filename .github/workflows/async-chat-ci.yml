name: Async Chat CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  async-chat-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ui_upgrade.sh
          python3 -m py_compile scripts/control_center_v2.py scripts/control_center_v4.py
          node --check scripts/control_center_async.js

      - name: Async request contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ThreadPoolExecutor(' scripts/control_center_v4.py
          grep -Fq '"/api/chat/jobs/"' scripts/control_center_v4.py
          grep -Fq 'self.send_json(202' scripts/control_center_v4.py
          grep -Fq 'EXECUTOR.submit(run_job' scripts/control_center_v4.py
          grep -Fq 'pollJob' scripts/control_center_async.js
          grep -Fq "fetch('/api/chat'" scripts/control_center_async.js
          grep -Fq "fetch(job.poll_url" scripts/control_center_async.js
          grep -Fq 'stopImmediatePropagation' scripts/control_center_async.js
          grep -Fq 'Cloudflare-safe async chat submit + polling installed' scripts/ui_upgrade.sh
          grep -Fq 'control_center_v4.py' scripts/ui_upgrade.sh
          grep -Fq 'control_center_async.js' scripts/ui_upgrade.sh

      - name: Agent-owned runtime policy contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'agent.run_budget_seconds' scripts/control_center_v4.py
          grep -Fq 'agent.gateway_timeout' scripts/control_center_v4.py
          grep -Fq 'agents.defaults.timeoutSeconds' scripts/control_center_v4.py
          grep -Fq 'openclaw-upstream-default-172800' scripts/control_center_v4.py
          grep -Fq 'def resolve_runtime_policy' scripts/control_center_v4.py
          grep -Fq 'def transport_timeout' scripts/control_center_v4.py
          grep -Fq 'runtime_policy' scripts/control_center_v4.py
          grep -Fq 'poll_token' scripts/control_center_v4.py
          grep -Fq 'X-Auto-Agent-Job-Token' scripts/control_center_v4.py
          grep -Fq 'for (;;)' scripts/control_center_async.js
          grep -Fq 'agent runtime: no hard cap' scripts/control_center_async.js
          grep -Fq 'X-Auto-Agent-Job-Token' scripts/control_center_async.js
          ! grep -Fq '15 * 60 * 1000' scripts/control_center_async.js
          ! grep -Fq '15 minute client wait limit' scripts/control_center_async.js
          ! grep -Fq 'timeout=900' scripts/control_center_v4.py

      - name: Runtime policy unit test
        shell: bash
        env:
          AUTO_AGENT_APP_DIR: ${{ github.workspace }}/scripts
          AUTO_AGENT_CONTROL_PASSWORD: test-password
          AUTO_AGENT_SESSION_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          OPENCLAW_LOCAL_PASSWORD: local-password
          AUTO_AGENT_PUBLIC_DOMAIN: example.com
          AUTO_AGENT_CENTER_PUBLIC_HOST: workspace.example.com
          AUTO_AGENT_HERMES_PUBLIC_HOST: hermes.example.com
          AUTO_AGENT_OPENCLAW_PUBLIC_HOST: openclaw.example.com
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import time
          spec = importlib.util.spec_from_file_location('cc4', 'scripts/control_center_v4.py')
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          assert m.parse_duration('null', 123) is None
          assert m.parse_duration('0', 123) is None
          assert m.parse_duration('172800', None) == 172800
          assert m.transport_timeout({'hard_limit_seconds': None}) is None
          assert m.transport_timeout({'hard_limit_seconds': 600}) > 600

          m.run_hermes = lambda message, policy: 'ok:' + message
          job_id = 'unit-job'
          policy = {
              'agent': 'hermes',
              'hard_limit_seconds': None,
              'hard_limit_source': 'unit-test',
              'inactivity_timeout_seconds': 1800,
              'unlimited': True,
          }
          with m.JOB_LOCK:
              m.JOBS[job_id] = {
                  'status': 'queued',
                  'agent': 'hermes',
                  'conversation_id': 'conv',
                  'created_at': time.time(),
                  'runtime_policy': policy,
                  'poll_token_hash': m.hash_poll_token('secret-token'),
              }
          m.run_job(job_id, 'hermes', 'network diagnostics', 'conv', '127.0.0.1')
          with m.JOB_LOCK:
              job = dict(m.JOBS[job_id])
          assert job['status'] == 'done', job
          assert job['answer'] == 'ok:network diagnostics', job
          assert m.job_token_valid(job, 'secret-token')
          assert not m.job_token_valid(job, 'wrong-token')
          PY
